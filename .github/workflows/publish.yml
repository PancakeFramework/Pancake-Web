name: Publish to PyPI

on:
  push:
    branches: [main]
    paths:
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      force_publish:
        description: '强制发布（忽略版本检查）'
        required: false
        default: 'false'
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Read metadata from pyproject.toml
        id: metadata
        run: |
          VERSION=$(poetry version --short)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

      - name: Check if version tag exists
        id: check-tag
        run: |
          VERSION="${{ steps.metadata.outputs.version }}"
          FORCE="${{ inputs.force_publish || 'false' }}"
          if [ "$FORCE" = "true" ]; then
            echo "✅ 强制发布模式，跳过版本检查"
            echo "published=true" >> $GITHUB_OUTPUT
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "⚠️ 版本 v$VERSION 已存在，跳过发布"
            echo "published=false" >> $GITHUB_OUTPUT
          else
            echo "✅ 版本 v$VERSION 可以发布"
            echo "published=true" >> $GITHUB_OUTPUT
          fi

      - name: Build package
        if: steps.check-tag.outputs.published == 'true'
        run: poetry build

      - name: Publish to PyPI
        if: steps.check-tag.outputs.published == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create Git tag
        if: steps.check-tag.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v${{ steps.metadata.outputs.version }}" -m "Release v${{ steps.metadata.outputs.version }}"
          git push origin "v${{ steps.metadata.outputs.version }}"

      - name: Create GitHub Release
        if: steps.check-tag.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.metadata.outputs.version }}"
          name: "pancake-web v${{ steps.metadata.outputs.version }}"
          generate_release_notes: true
          body: |
            ## pancake-web v${{ steps.metadata.outputs.version }}

            Spring MVC 风格 Web 服务器插件。

            ### Install

            ```bash
            pip install pancake-web
            ```

            ### Features
            - @controller + @get/@post/@put/@delete 路由
            - Spring 风格参数绑定 (path_variable, request_param, request_body)
            - 返回值自动转换 (dict/list/dataclass → JSON)
            - 中间件 (@middleware)
            - 全局异常处理 (@exception_handler)
            - CORS / Session / 静态文件
            - YAML 配置驱动
