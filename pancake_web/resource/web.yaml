# pancake-web 缺省配置
# 将此文件复制到 src/resource/yaml/web.yaml 并按需修改

web:
  # 服务器地址
  host: 127.0.0.1
  port: 8080

  # 调试模式（开启后显示详细错误信息）
  debug: false

  # 静态文件目录（相对于项目根目录）
  static: src/static

  # 模板目录
  templates: src/templates

  # 跨域配置
  cors:
    allow_origins: "*"                    # 允许的来源，多个用逗号分隔
    allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
    allow_headers: "*"
    max_age: 3600                         # 预检缓存时间（秒）

  # Session 配置
  session:
    secret_key: null                      # 留空则每次启动生成随机 key
    max_age: 86400                        # Session 有效期（秒）
    secure: false                         # 是否仅 HTTPS

  # 请求配置
  request:
    timeout: 30                           # 请求超时（秒）
    max_body_size: 1048576                # 最大请求体（字节），默认 1MB

  # 服务器配置
  server:
    max_connections: 100                  # 最大并发连接数
    backlog: 128                          # TCP backlog
