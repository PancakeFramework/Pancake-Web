[tool.poetry]
name = "pancake-web"
version = "0.1.2"
description = "Pancake Web Plugin - aiohttp 驱动的 Web 服务器插件"
authors = ["drayee <1473443474@qq.com>"]
license = "MIT"
readme = "README.md"
packages = [{include = "pancake_web"}]

[tool.poetry.dependencies]
python = "^3.10"
pancake_framework = ">=0.2.0"
aiohttp = "^3.9.0"

[tool.poetry.plugins."pancake.plugins"]
web = "pancake_web:Main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
